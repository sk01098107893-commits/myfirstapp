<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>최경희 — 안과 밖의 통합</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --violet-deep:  #1a0533;
      --violet-mid:   #3b1069;
      --violet-soft:  #7b2fbf;
      --violet-glow:  #b06bff;
      --violet-pale:  #ddb8ff;
      --white-ghost:  rgba(255,255,255,0.85);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--violet-deep);
      font-family: 'Noto Serif KR', serif;
      color: var(--white-ghost);
      cursor: default;
    }

    /* ─── Gradient background ─── */
    .bg-gradient {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%,  #4a0f9e55 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 80% 90%,  #7b10cc44 0%, transparent 65%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #2d0a5e   0%, #0d0020 100%);
      animation: breathe 12s ease-in-out infinite alternate;
    }
    @keyframes breathe {
      from { opacity: 0.85; }
      to   { opacity: 1; }
    }

    /* ─── Floating hanja layer ─── */
    .hanja-layer {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .hanja {
      position: absolute;
      font-family: 'Noto Serif SC', 'Noto Serif KR', serif;
      font-weight: 300;
      color: var(--violet-glow);
      opacity: 0;
      animation: floatUp var(--dur, 18s) var(--delay, 0s) ease-in-out infinite;
      text-shadow: 0 0 40px var(--violet-soft), 0 0 80px #7b2fbf66;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(var(--rot, 0deg)) scale(0.8); opacity: 0; }
      10%  { opacity: var(--peak, 0.18); }
      80%  { opacity: var(--peak, 0.18); }
      100% { transform: translateY(-20vh) rotate(calc(var(--rot, 0deg) + 15deg)) scale(1.1); opacity: 0; }
    }

    /* ─── Noise grain overlay ─── */
    .grain {
      position: fixed; inset: 0; z-index: 2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      opacity: 0.55;
      pointer-events: none;
    }

    /* ─── Shimmer lines ─── */
    .shimmer-line {
      position: fixed; z-index: 2;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--violet-glow), transparent);
      opacity: 0;
      animation: shimmerLine var(--sd, 8s) var(--sl, 0s) ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shimmerLine {
      0%   { opacity: 0; height: 0;    top: 0; }
      30%  { opacity: 0.25; }
      50%  { height: 40vh; }
      80%  { opacity: 0; }
      100% { opacity: 0; height: 0;    top: 100%; }
    }

    /* ─── Content ─── */
    .stage {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2.2rem;
      text-align: center;
      padding: 2rem;
    }

    .badge {
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--violet-pale);
      opacity: 0;
      animation: fadeIn 1.2s 0.3s ease forwards;
    }

    .name {
      font-size: clamp(2.6rem, 6vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 0 60px var(--violet-glow), 0 0 120px var(--violet-soft);
      opacity: 0;
      animation: fadeUp 1.4s 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 300;
      color: var(--violet-pale);
      letter-spacing: 0.15em;
      opacity: 0;
      animation: fadeUp 1.4s 1.1s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .divider {
      width: 60px; height: 1px;
      background: linear-gradient(to right, transparent, var(--violet-glow), transparent);
      opacity: 0;
      animation: fadeIn 1.4s 1.5s ease forwards;
    }

    .sub {
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.45);
      opacity: 0;
      animation: fadeIn 1.4s 1.9s ease forwards;
    }

    /* ─── Music toggle ─── */
    .music-btn {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 20;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(176,107,255,0.4);
      background: rgba(58,12,105,0.5);
      backdrop-filter: blur(12px);
      color: var(--violet-pale);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
      opacity: 0;
      animation: fadeIn 1.4s 2.4s ease forwards;
    }
    .music-btn:hover {
      border-color: var(--violet-glow);
      background: rgba(90,20,160,0.7);
      box-shadow: 0 0 24px var(--violet-soft);
    }
    .music-btn.playing { box-shadow: 0 0 20px var(--violet-glow); }

    /* ─── Ripple cursor ─── */
    .ripple {
      position: fixed; z-index: 5;
      border-radius: 50%;
      pointer-events: none;
      animation: rippleAnim 1.2s ease-out forwards;
    }
    @keyframes rippleAnim {
      from { width: 0; height: 0; opacity: 0.6; transform: translate(-50%,-50%); }
      to   { width: 120px; height: 120px; opacity: 0; transform: translate(-50%,-50%); }
    }

    /* ─── Keyframe helpers ─── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg-gradient"></div>

  <!-- Hanja floating characters: 內 外 心 行 -->
  <div class="hanja-layer" id="hanjaLayer"></div>

  <!-- Grain -->
  <div class="grain"></div>

  <!-- Shimmer lines -->
  <div class="shimmer-line" style="left:15%; --sd:11s; --sl:0s;"></div>
  <div class="shimmer-line" style="left:38%; --sd:14s; --sl:3s;"></div>
  <div class="shimmer-line" style="left:62%; --sd:9s;  --sl:6s;"></div>
  <div class="shimmer-line" style="left:82%; --sd:13s; --sl:1.5s;"></div>

  <!-- Content -->
  <div class="stage">
    <p class="badge">Personal Introduction</p>
    <h1 class="name">최경희</h1>
    <p class="tagline">안과 밖의 통합을 꿈꾸는</p>
    <div class="divider"></div>
    <p class="sub">內 · 外 · 心 · 行</p>
  </div>

  <!-- Music button -->
  <button class="music-btn" id="musicBtn" title="배경음악 켜기/끄기">♪</button>
  <audio id="bgAudio" src="bg.mp3" loop></audio>

  <script>
    /* ── Hanja generator ── */
    const chars  = ['內','外','心','行'];
    const labels = ['안 내','밖 외','마음 심','행할 행'];
    const layer  = document.getElementById('hanjaLayer');
    const COUNT  = 28;

    for (let i = 0; i < COUNT; i++) {
      const el  = document.createElement('span');
      const idx = i % chars.length;
      el.className  = 'hanja';
      el.textContent = chars[idx];
      el.title       = labels[idx];

      const size  = 3 + Math.random() * 9;       // rem
      const left  = Math.random() * 96;           // %
      const dur   = 16 + Math.random() * 18;      // s
      const delay = Math.random() * 20;           // s
      const rot   = (Math.random() - 0.5) * 30;  // deg
      const peak  = 0.06 + Math.random() * 0.18;

      el.style.cssText = `
        font-size: ${size}rem;
        left: ${left}%;
        bottom: -10%;
        --dur: ${dur}s;
        --delay: ${delay}s;
        --rot: ${rot}deg;
        --peak: ${peak};
      `;
      layer.appendChild(el);
    }

    /* ── Music toggle ── */
    const btn   = document.getElementById('musicBtn');
    const audio = document.getElementById('bgAudio');
    let playing = false;

    btn.addEventListener('click', () => {
      if (!playing) {
        audio.play().catch(() => {});
        btn.textContent = '♫';
        btn.classList.add('playing');
        playing = true;
      } else {
        audio.pause();
        btn.textContent = '♪';
        btn.classList.remove('playing');
        playing = false;
      }
    });

    /* ── Ripple on click ── */
    document.addEventListener('click', (e) => {
      if (e.target === btn) return;
      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.cssText = `
        left: ${e.clientX}px; top: ${e.clientY}px;
        border: 1px solid rgba(176,107,255,0.6);
        background: radial-gradient(circle, rgba(176,107,255,0.15) 0%, transparent 70%);
      `;
      document.body.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
    });
  </script>
</body>
</html>
